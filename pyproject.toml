[project]
name = "kanji-flashcard-app"
version = "0.1.0"
description = "A learning-focused kanji flashcard application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kanji-flashcard = "kanji_flashcard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kanji_flashcard"

[tool.pytest.ini_options]
testpaths = ["tests"]
